[pytest]
# DJANGO_SETTINGS_MODULE is set for the Django-backed tests arriving in Phase 4+
# (services, endpoints). The Phase 3 engine tests import no Django at all, and
# risk/tests/test_engine.py::TestEnginePurity proves it by importing the engine
# in a subprocess with this variable stripped from the environment.
DJANGO_SETTINGS_MODULE = config.settings

testpaths = risk common portfolio marketdata alerts accounts
python_files = test_*.py tests.py
addopts = -q --strict-markers
