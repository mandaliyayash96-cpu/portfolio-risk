<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Risk</title>
    <!--
      Inter, with a system stack behind it.

      preconnect to BOTH hosts: googleapis serves the CSS, gstatic serves the
      font files, and the second connection is the one that actually costs time
      on a cold load. `display=swap` means a demo on a bad network paints in the
      fallback immediately rather than showing nothing - and the fallback stack
      below is chosen to be metrically close enough that the swap is not a jump.

      If the CDN is unreachable the whole thing degrades to Segoe UI / system-ui
      with no layout change, which is the state the dashboard shipped in before.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Stamp the theme BEFORE the first paint.

      React cannot do this job. The bundle is fetched, parsed and mounted after
      the browser has already painted the page, so a dark-mode user would get a
      white flash on every load and every refresh - which on a projector in a
      darkened room is the most visible thing on screen. This runs synchronously
      in <head>, so the very first paint is already the right colour.

      Kept deliberately tiny and dependency-free: it duplicates
      resolveInitialTheme() from src/theme.js, and that is the trade for having
      it run this early. Keep the two in step.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('portfolio-risk:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
